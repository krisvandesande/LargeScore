name: LargeScore
options:
  bundleIdPrefix: com.kvds
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: UJJPJ9ZHNN
    TARGETED_DEVICE_FAMILY: "2,6"
    SUPPORTS_MACCATALYST: YES
    # One app on iPad and Mac: the Mac build keeps the iPad's bundle id.
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Local builds say what they are in their name: "Large Score (Debug).app",
    # "Large Score (Test).app" for a Release build that isn't archived. Archives
    # (TestFlight, App Store) keep the plain name. The home screen name stays
    # "Large Score" (Info.plist). Bundle identifier unchanged.
    APP_PRODUCT_NAME_PLAIN: LargeScore
    APP_DISPLAY_NAME_PLAIN: Large Score
    APP_PRODUCT_NAME_TAGGED: $(APP_TAGGED_NAME)
    APP_DISPLAY_NAME_TAGGED: $(APP_TAGGED_NAME)
    APP_PRODUCT_NAME: $(APP_PRODUCT_NAME_$(APP_NAME_KIND))
    APP_DISPLAY_NAME: $(APP_DISPLAY_NAME_$(APP_NAME_KIND))
  configs:
    Debug:
      APP_TAGGED_NAME: $(APP_DISPLAY_NAME_PLAIN) (Debug)
      APP_NAME_KIND: TAGGED
    Release:
      APP_TAGGED_NAME: $(APP_DISPLAY_NAME_PLAIN) (Test)
      APP_NAME_KIND: $(APP_NAME_KIND_$(DEPLOYMENT_LOCATION))
      APP_NAME_KIND_NO: TAGGED
      APP_NAME_KIND_YES: PLAIN
packages:
  VerovioKit:
    path: Packages/VerovioKit
  # Updates for Large Score Converter, outside the App Store (MIT).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  LargeScore:
    type: application
    platform: iOS
    sources:
      - path: LargeScore
    dependencies:
      - package: VerovioKit
        product: VerovioToolkit
    info:
      path: LargeScore/Info.plist
      properties:
        CFBundleDisplayName: Large Score
        LSApplicationCategoryType: public.app-category.music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        LSSupportsOpeningDocumentsInPlace: true
        # Large Score's own folder in iCloud Drive, shown as "Large Score" on every
        # device: music put there (by the Converter on the Mac Pro, or by hand) is added
        # by itself, with no folder to choose.
        NSUbiquitousContainers:
          iCloud.com.kvds.LargeScore:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Large Score
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDocumentTypes:
          - CFBundleTypeName: MusicXML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.recordare.musicxml.uncompressed, com.recordare.musicxml]
          - CFBundleTypeName: XML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.xml]
          # An .mxl the iPad files under another type (a ZIP, or another app's own
          # MusicXML type) still offers Large Score; the contents are checked on reading.
          - CFBundleTypeName: Music File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.recordare.musicxml.uncompressed
            UTTypeDescription: MusicXML
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
              public.mime-type: [application/vnd.recordare.musicxml+xml]
          - UTTypeIdentifier: com.recordare.musicxml
            UTTypeDescription: Compressed MusicXML
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
              public.mime-type: [application/vnd.recordare.musicxml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvds.LargeScore
        CODE_SIGN_ENTITLEMENTS: LargeScore/LargeScore.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": LargeScore/LargeScoreMac.entitlements
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: LargeScore
        EXECUTABLE_NAME: LargeScore
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "13"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad (2) and Mac Catalyst (6) only. Set here, on the target: XcodeGen's
        # iOS app template puts iPhone and iPad ("1,2") on the target, which
        # overrode the project-wide setting, and build 5 shipped for iPhone too.
        TARGETED_DEVICE_FAMILY: "2,6"
  # The companion for the Mac that holds the PDFs (his Mac Pro: Intel, Monterey):
  # converts with Audiveris, shows the result beside the PDF for fixing, and puts
  # it in the Large Score folder in iCloud Drive, which the iPad reads. A
  # Developer ID download, notarised; not in the App Store, so it may run Audiveris.
  LargeScoreConverter:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Converter
      - path: LargeScore/Engraving/Engraver.swift
      - path: LargeScore/Engraving/KeyReminders.swift
      - path: LargeScore/Engraving/MusicXMLEdit.swift
      - path: LargeScore/Engraving/PartSplitter.swift
      - path: LargeScore/Engraving/SVGScene.swift
      - path: LargeScore/Engraving/TextLayout.swift
      - path: LargeScore/Engraving/Transposition.swift
      - path: LargeScore/Engraving/VerovioEngraver.swift
      - path: LargeScore/Import/MusicFile.swift
      - path: LargeScore/Import/ZipReader.swift
      - path: LargeScore/App/Instrument.swift
      - path: LargeScore/Library/PartGrouping.swift
      - path: LargeScore/Localizable.xcstrings
    dependencies:
      - package: VerovioKit
        product: VerovioToolkit
      - package: Sparkle
        product: Sparkle
    info:
      path: Converter/Info.plist
      properties:
        CFBundleDisplayName: Large Score Converter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "12.0"
        NSHumanReadableCopyright: ""
        # Sparkle: the feed is the latest GitHub release's appcast.xml; updates are
        # checked daily and installed without asking, signed with this key's pair
        # (kept in ~/Library/Application Support/LargeScoreSigning, never in the repo).
        SUFeedURL: https://github.com/krisvandesande/LargeScore/releases/latest/download/appcast.xml
        SUPublicEDKey: Yr25FtwZ70kDECI2CQwhuWv+5GPZWBZ84SROpqZhHJc=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvds.LargeScoreConverter
        PRODUCT_NAME: Large Score Converter
        PRODUCT_MODULE_NAME: LargeScoreConverter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        TARGETED_DEVICE_FAMILY: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signed to run here while building; scripts/release-converter.sh signs the
        # download with Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Both kinds of Mac: his Mac Pro is Intel.
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
  # Runs without the app or a window: the logic, a conversion with a stand-in
  # Audiveris, and the views drawn off screen to pictures in build/converter.
  LargeScoreConverterTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: ConverterTests
      - path: Converter
        excludes: [ConverterApp.swift, Info.plist]
      - path: LargeScore/Engraving/Engraver.swift
      - path: LargeScore/Engraving/KeyReminders.swift
      - path: LargeScore/Engraving/MusicXMLEdit.swift
      - path: LargeScore/Engraving/PartSplitter.swift
      - path: LargeScore/Engraving/SVGScene.swift
      - path: LargeScore/Engraving/TextLayout.swift
      - path: LargeScore/Engraving/Transposition.swift
      - path: LargeScore/Engraving/VerovioEngraver.swift
      - path: LargeScore/Import/MusicFile.swift
      - path: LargeScore/Import/ZipReader.swift
      - path: LargeScore/App/Instrument.swift
      - path: LargeScore/Library/PartGrouping.swift
    dependencies:
      - package: VerovioKit
        product: VerovioToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvds.LargeScoreConverter.Tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        TARGETED_DEVICE_FAMILY: ""
        SUPPORTS_MACCATALYST: NO
  LargeScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LargeScoreTests]
    dependencies:
      - target: LargeScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvds.LargeScore.Tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_PRODUCT_NAME).app/LargeScore
        GENERATE_INFOPLIST_FILE: YES
  LargeScoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LargeScoreUITests]
    dependencies:
      - target: LargeScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvds.LargeScore.UITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: LargeScore
schemes:
  LargeScoreConverter:
    build:
      targets:
        LargeScoreConverter: all
        LargeScoreConverterTests: [test]
    test:
      targets: [LargeScoreConverterTests]
  LargeScore:
    build:
      targets:
        LargeScore: all
        LargeScoreTests: [test]
        LargeScoreUITests: [test]
    test:
      targets: [LargeScoreTests, LargeScoreUITests]
