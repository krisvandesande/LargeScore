name: LargeScore
options:
  bundleIdPrefix: be.kvds
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  VerovioKit:
    path: Packages/VerovioKit
targets:
  LargeScore:
    type: application
    platform: iOS
    sources:
      - path: LargeScore
    dependencies:
      - package: VerovioKit
        product: VerovioToolkit
    info:
      path: LargeScore/Info.plist
      properties:
        CFBundleDisplayName: Large Score
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.kvds.largescore
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  LargeScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LargeScoreTests]
    dependencies:
      - target: LargeScore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.kvds.largescore.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LargeScore:
    build:
      targets:
        LargeScore: all
        LargeScoreTests: [test]
    test:
      targets: [LargeScoreTests]
